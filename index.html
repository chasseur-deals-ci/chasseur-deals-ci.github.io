      tg: 'Follow on Telegram',
      official: 'Official store',
      third: 'Third-party seller',
      rating: '★ {r} ({n} reviews)',
      noRating: 'No reviews yet',
      basisListed: 'vs. crossed-out price',
      basisHistory: 'vs. usual price observed ({p}, tracked over {s})',
      inflated: 'Very high crossed-out price: take the discount with caution.',
      lowest: 'Lowest price observed over {s}',
      seen: 'Price collected: {d}',
      seenOk: 'Price collected and checked: {d}',
      spark: 'Collected price trend',
      img: 'Images come from Jumia product pages.',
      empty: 'No reliable deal in this category yet. Check back after the next update.',
      count: '{n} deals',
      count1: '{n} deal',
      hours: '{n} h',
      days: '{n} d',
      f1: 'Affiliate links: if you buy after clicking my link, I earn a commission from Jumia. The price you pay does not change.',
      f2: 'Chasseur de deals CI is an independent site, neither published nor endorsed by Jumia. Jumia is a trademark of its owners.',
      f3: 'Prices and stock were collected at the time shown: they can change at any moment. Always check the Jumia page before paying.',
      f4: 'Product images come from Jumia product pages and remain the property of their owners.',
      f5: '© {y} Serge Kedja, Abidjan, Côte d\'Ivoire.',
      navAbout: 'About', navLegal: 'Legal notice', navPrivacy: 'Privacy',
      navDisclaimer: 'Disclaimer', navAffil: 'Affiliation', navCopy: 'Copyright & trademarks',
      lang: 'FR'
    }
  };

  var ICONS = {
    telephones: '<rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/>',
    informatique: '<path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/>',
    tv_son: '<rect width="20" height="15" x="2" y="7" rx="2"/><path d="m17 2-5 5-5-5"/>',
    electromenager: '<path d="M5 6a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2Z"/><path d="M5 10h14M15 7v6"/>',
    maison: '<path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
    quotidien: '<path d="m15 11-1 9m5-9-4-7M2 11h20m-18.5 0 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4M5 11l4-7m0 7 1 9"/>',
    bebe: '<path d="M9 12h.01M15 12h.01M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><path d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1"/>'
  };
  var WA_PATH = 'M12.04 2a9.9 9.9 0 0 0-8.5 15l-1.4 5 5.1-1.3A9.9 9.9 0 1 0 12.04 2Zm5.8 14.1c-.25.7-1.4 1.3-1.95 1.35-.5.05-1.1.2-3.7-.8-3.1-1.3-5.1-4.5-5.25-4.7-.15-.2-1.25-1.65-1.25-3.15s.8-2.25 1.05-2.55c.3-.3.6-.35.8-.35h.55c.2 0 .4 0 .6.45.25.55.8 1.95.85 2.1.1.15.1.3 0 .5s-.15.3-.3.5c-.15.15-.3.35-.45.5-.15.15-.3.3-.15.6.15.3.7 1.2 1.55 1.95 1.05.95 1.95 1.25 2.25 1.4.3.15.45.1.65-.1.15-.2.7-.8.9-1.1.2-.3.4-.25.65-.15.25.1 1.65.8 1.95.95.3.15.5.2.55.3.1.1.1.65-.15 1.35Z';

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function put(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var lang = get('cdci_lang') || ((navigator.language || 'fr').slice(0, 2) === 'en' ? 'en' : 'fr');
  if (!STR[lang]) lang = 'fr';
  var data = SEED;
  var site = {};
  var unlockUntil = parseInt(get('cdci_unlock') || '0', 10) || 0;
  var lastReload = 0;
  var SVGNS = 'http://www.w3.org/2000/svg';

  function t(key, vars) {
    var s = STR[lang][key] || key;
    if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function svg(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    (kids || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  // Les icônes sont des constantes du code (pas des données reçues) : on les lit via DOMParser, sans innerHTML.
  function iconSvg(inner, cls, viewBox) {
    var doc = new DOMParser().parseFromString(
      '<svg xmlns="' + SVGNS + '" viewBox="' + (viewBox || '0 0 24 24') + '" class="' + (cls || '') + '" aria-hidden="true">' + inner + '</svg>', 'image/svg+xml');
    return document.importNode(doc.documentElement, true);
  }
  function fcfa(n, approx) {
    var locale = lang === 'fr' ? 'fr-FR' : 'en-GB';
    return (approx ? '≈ ' : '') + n.toLocaleString(locale).replace(/[  ]/g, ' ') + ' FCFA';
  }
  function span(h) { return h < 48 ? t('hours', { n: Math.max(1, Math.round(h)) }) : t('days', { n: Math.round(h / 24) }); }
  // Péremption : 0 = à jour, 1 = en retard de plus de 3 h (bandeau), 2 = en retard de plus de 36 h (offres masquées).
  // Les données de départ (seed) ne sont jamais jugées périmées.
  function staleLevel() {
    if (data.meta.seed) return 0;
    var late = Date.now() - Date.parse(data.meta.next_update);
    return late > 36 * 3600 * 1000 ? 2 : late > 3 * 3600 * 1000 ? 1 : 0;
  }
  var lastStale = 0;
  // Appareil du propriétaire : ?moi=1 le marque (stockage local seulement), ?moi=0 annule. Le compteur n'y est alors pas chargé.
  function isMine() { return get('cdci_moi') === '1'; }
  (function () {
    try {
      var m = new URLSearchParams(location.search).get('moi');
      if (m === '1') put('cdci_moi', '1');
      else if (m === '0') { try { localStorage.removeItem('cdci_moi'); } catch (e) {} }
    } catch (e) {}
  })();
  function unlocked() { return Date.now() < unlockUntil; }
  function clock(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return [h, m, x].map(function (v) { return String(v).padStart(2, '0'); }).join(':');
  }
  function when(iso, dateOnly) {
    try {
      var o = dateOnly ? { day: 'numeric', month: 'long', timeZone: 'UTC' }
        : { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'UTC' };
      return new Intl.DateTimeFormat(lang === 'fr' ? 'fr-FR' : 'en-GB', o).format(new Date(iso));
    } catch (e) { return iso; }
  }
  function pageUrl() { return location.origin + location.pathname; }
  function waLink(text) { return 'https://wa.me/?text=' + encodeURIComponent(text + ' ' + pageUrl()); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : null; }
  // Adresses issues des données : https et domaine attendu uniquement (jamais d'adresse externe ni de javascript:).
  function hostOk(u, suffixes) {
    try {
      var x = new URL(u);
      if (x.protocol !== 'https:') return false;
      return suffixes.some(function (h) { return x.hostname === h || x.hostname.slice(-(h.length + 1)) === '.' + h; });
    } catch (e) { return false; }
  }
  var PAGE_HOSTS = ['jumia.ci'], IMG_HOSTS = ['jumia.is', 'jumia.ci'];

  function unlock() {
    unlockUntil = Date.now() + UNLOCK_MS;
    put('cdci_unlock', String(unlockUntil));
    render();
  }
  function openAffiliate() {
    if (!hostOk(data.meta.affiliate_url, PAGE_HOSTS)) return;
    window.open(data.meta.affiliate_url, '_blank', 'noopener');
    unlock();
  }

  function renderUnlocked() {
    var box = document.getElementById('unl');
    box.hidden = !unlocked();
    box.textContent = unlocked() ? t('unlocked') : '';
  }

  function sparkline(d) {
    var pts = d.spark || [];
    if (pts.length < 3) return null;
    var lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts);
    if (hi === lo) return null;
    var W = 64, H = 20, pad = 2;
    var xy = pts.map(function (v, i) {
      return [pad + i * (W - 2 * pad) / (pts.length - 1), H - pad - (v - lo) / (hi - lo) * (H - 2 * pad)];
    });
    var last = xy[xy.length - 1];
    var s = svg('svg', { class: 'spark', viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': t('spark') }, [
      svg('polyline', { points: xy.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') }),
      svg('circle', { cx: last[0].toFixed(1), cy: last[1].toFixed(1), r: '2.2' })
    ]);
    return s;
  }

  function thumb(d, cat) {
    var box = el('div', { class: 'thumb' });
    function fallback() {
      box.textContent = '';
      box.appendChild(iconSvg(ICONS[cat] || ICONS.maison));
    }
    var src = hostOk(d.img, IMG_HOSTS) ? d.img : null;
    if (!src) { fallback(); return box; }
    var img = el('img', { src: src, alt: '', width: '72', height: '72', loading: 'lazy', decoding: 'async', referrerpolicy: 'no-referrer' });
    img.addEventListener('error', fallback);
    box.appendChild(img);
    return box;
  }

  function dealRow(d, i, cat) {
    var top = i < 3;
    var name = el('a', { class: 'name', href: d.url, target: '_blank', rel: 'noopener sponsored nofollow', text: d.name });
    var tags = el('div', { class: 'tags' }, [
      el('span', { class: 'tag ' + (d.official ? 'official' : ''), text: d.official ? t('official') : t('third') }),
      el('span', { class: 'tag', text: d.rating && d.reviews ? t('rating', { r: String(d.rating).replace('.', lang === 'fr' ? ',' : '.'), n: d.reviews }) : t('noRating') })
    ]);
    var basis = '';
    if (d.discount) {
      basis = d.basis === 'history' && d.ref
        ? t('basisHistory', { p: fcfa(d.ref), s: span(d.ref_hours || 1) })
        : t('basisListed');
    }
    var price = el('div', { class: 'price' }, [
      el('span', { class: 'now', text: fcfa(d.price, d.approx) }),
      d.old ? el('span', { class: 'was', text: fcfa(d.old) }) : null,
      d.discount ? el('span', { class: 'off', text: '−' + d.discount + ' %' }) : null,
      d.discount ? el('span', { class: 'note', text: basis }) : null,
      d.inflated ? el('span', { class: 'note warn', text: t('inflated') }) : null
    ]);
    var low = d.is_lowest ? el('span', { class: 'low', text: t('lowest', { s: span(d.hist_hours || 1) }) }) : null;
    var stamp = d.seen_at || data.meta.updated_at;
    var seen = el('div', { class: 'seen' }, [
      sparkline(d),
      el('span', { text: t(d.verified ? 'seenOk' : 'seen', { d: when(stamp) }) })
    ]);
    var go = el('a', { class: 'btn alt go', href: d.url, target: '_blank', rel: 'noopener sponsored nofollow', text: t('go'), 'aria-label': t('go') + ' : ' + d.name });
    var share = el('a', {
      class: 'btn alt share', target: '_blank', rel: 'noopener',
      href: waLink(t('shareText', { n: d.name.length > 70 ? d.name.slice(0, 67) + '…' : d.name, p: fcfa(d.price, d.approx) })),
      'aria-label': t('share') + ' WhatsApp : ' + d.name
    }, [iconSvg('<path d="' + WA_PATH + '"/>'), el('span', { text: t('share') })]);
    return el('li', { class: 'deal' + (top ? ' top' : '') }, [
      el('span', { class: 'rank', text: String(i + 1) }),
      thumb(d, cat),
      el('div', { class: 'main' }, [name, tags, price, low, seen, el('div', { class: 'actions' }, [go, share])])
    ]);
  }

  function lockedBlock(n, from) {
    var ghosts = [];
    for (var k = 0; k < Math.min(n, 2); k++) {
      ghosts.push(el('div', { class: 'ghost', 'aria-hidden': 'true' }, [el('b', { text: String(from + k) }), el('div', {}, [el('span'), el('span')])]));
    }
    var b = el('button', { type: 'button', class: 'btn', text: t('more', { n: n }) });
    b.addEventListener('click', openAffiliate);
    return el('div', { class: 'locked' }, ghosts.concat([b]));
  }

  function renderDeals() {
    var main = document.getElementById('main');
    var chips = document.getElementById('chiplist');
    main.textContent = ''; chips.textContent = '';
    var free = data.meta.free_per_category || 3;
    var order = data.meta.category_order || Object.keys(data.meta.categories);
    order.forEach(function (cat) {
      if (staleLevel() === 2) return;
      var list = ((data.deals && data.deals[cat]) || []).filter(function (d) { return hostOk(d.url, PAGE_HOSTS); });
      if (!list.length || !data.meta.categories[cat]) return;
      var label = data.meta.categories[cat][lang];
      chips.appendChild(el('li', {}, [el('a', { href: '#' + cat, text: label })]));
      var shown = unlocked() ? list : list.slice(0, free);
      var ol = el('ol', { class: 'deals' }, shown.map(function (d, i) { return dealRow(d, i, cat); }));
      var kids = [
        el('h2', { text: label }),
        el('p', { class: 'count', text: t(list.length === 1 ? 'count1' : 'count', { n: list.length }) + ' · ' + t('img') }),
        ol
      ];
      if (!unlocked() && list.length > free) kids.push(lockedBlock(list.length - free, free + 1));
      main.appendChild(el('section', { class: 'cat', id: cat, 'aria-labelledby': 'h-' + cat }, kids));
      main.lastChild.querySelector('h2').id = 'h-' + cat;
    });
    if (!main.firstChild) main.appendChild(el('p', { class: 'empty', text: t(staleLevel() === 2 ? 'staleOld' : 'empty') }));
  }

  function renderHero() {
    var mode = data.meta.mode || {};
    var title = (mode.title && mode.title[lang]) || t('h1');
    var tag = (mode.tagline && mode.tagline[lang]) || t('lede');
    document.getElementById('h1').textContent = title;
    document.getElementById('lede').textContent = tag;
    // Le nom de la marque marchande reste hors du titre d'onglet et de l'aperçu de partage (décision du propriétaire).
    document.title = 'Chasseur de deals CI | ' + title.replace(/\bJumia\b\s*/gi, '').replace(/\s{2,}/g, ' ').trim();
    document.documentElement.style.setProperty('--accent', /^#[0-9a-fA-F]{6}$/.test(mode.accent || '') ? mode.accent : '#FFB000');
    var era = document.getElementById('era');
    era.textContent = ''; era.hidden = true;
    function label(m) { return (m && m[lang]) ? m[lang] : ''; }
    if (mode.ends_at && mode.id !== 'normal') {
      era.hidden = false;
      era.textContent = t('eraNow', { m: label(mode.title).split(':')[0].trim(), d: when(mode.ends_at, true) });
    } else if (data.meta.next_event) {
      var ne = data.meta.next_event;
      era.hidden = false;
      era.textContent = t('eraNext', { m: label(ne.title).split(':')[0].trim(), d: when(ne.start, true), e: ne.confirmed ? '' : t('est') });
    }
    var acts = document.getElementById('hero-actions');
    acts.textContent = '';
    acts.appendChild(el('a', { class: 'btn', target: '_blank', rel: 'noopener', href: waLink(t('sharePageText')), text: t('sharePage') }));
    var wa = safeUrl(site.social && site.social.whatsapp_channel), tg = safeUrl(site.social && site.social.telegram);
    if (wa) acts.appendChild(el('a', { class: 'btn', target: '_blank', rel: 'noopener', href: wa, text: t('wa') }));
    if (tg) acts.appendChild(el('a', { class: 'btn', target: '_blank', rel: 'noopener', href: tg, text: t('tg') }));
  }

  function renderStatic() {
    document.documentElement.lang = lang;
    document.getElementById('lang').textContent = t('lang');
    renderHero();
    document.getElementById('tlabel').textContent = t('next');
    var st = document.getElementById('stale');
    st.hidden = staleLevel() === 0;
    st.textContent = staleLevel() === 0 ? '' : t('stale', { d: when(data.meta.updated_at) });
    document.getElementById('tmeta').textContent = t('last', { d: when(data.meta.updated_at) });
    var sn = document.getElementById('seed-note');
    sn.hidden = !data.meta.seed;
    sn.textContent = data.meta.seed ? t('seed') : '';
    ['f1', 'f2', 'f3', 'f4'].forEach(function (id) { document.getElementById(id).textContent = t(id); });
    document.getElementById('f5').textContent = t('f5', { y: new Date().getFullYear() });
    var nav = document.getElementById('fnav');
    nav.textContent = '';
    [['navAbout', 'a-propos'], ['navLegal', 'mentions-legales'], ['navPrivacy', 'confidentialite'],
     ['navDisclaimer', 'avertissement'], ['navAffil', 'affiliation'], ['navCopy', 'droits-marques']].forEach(function (p) {
      nav.appendChild(el('a', { href: 'infos.html#' + p[1], text: t(p[0]) }));
    });
  }

  function render() { renderStatic(); renderUnlocked(); renderDeals(); tick(); }

  function tick() {
    var next = Date.parse(data.meta.next_update), start = Date.parse(data.meta.updated_at), now = Date.now();
    var digits = document.getElementById('tdigits');
    var remaining = next - now;
    if (remaining > 0) {
      digits.textContent = clock(remaining);
      digits.className = 't-digits';
      var sp = next - start;
      document.getElementById('meter').style.width = (sp > 0 ? Math.min(100, Math.max(0, (now - start) / sp * 100)) : 0) + '%';
    } else {
      digits.textContent = t(staleLevel() ? 'paused' : 'late');
      digits.className = 't-digits late';
      document.getElementById('meter').style.width = '100%';
      if (now - lastReload > 60000) reload();
    }
    var lvl = staleLevel();
    if (lvl !== lastStale) { lastStale = lvl; render(); return; }
    if (unlockUntil && !unlocked()) { unlockUntil = 0; renderUnlocked(); renderDeals(); }
  }

  function reload() {
    lastReload = Date.now();
    fetch('data/deals.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        if (j && j.meta && j.deals && (j.meta.updated_at !== data.meta.updated_at)) { data = j; render(); }
      })
      .catch(function () { /* on garde les données affichées */ });
  }

  function loadSite() {
    fetch('site.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        site = j || {};
        renderHero();
        // Mesure d'audience sans cookie (Cloudflare Web Analytics), seulement si un jeton est renseigné.
        if (site.analytics_token && /^[a-f0-9]{32}$/.test(site.analytics_token) && !isMine()) {
          var s = document.createElement('script');
          s.defer = true;
          s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
          s.setAttribute('data-cf-beacon', JSON.stringify({ token: site.analytics_token }));
          document.head.appendChild(s);
        }
      })
      .catch(function () {});
  }

  document.getElementById('lang').addEventListener('click', function () {
    lang = lang === 'fr' ? 'en' : 'fr';
    put('cdci_lang', lang);
    render();
  });

  render();
  reload();
  loadSite();
  setInterval(tick, 1000);
  setInterval(function () { if (!document.hidden) reload(); }, 10 * 60 * 1000);
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
